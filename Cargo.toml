[package]
name = "aschenbrenner-unlimited"
version = "0.1.0"
edition = "2021"
description = "Floor 2x / Ceiling UNLIMITED Aschenbrenner sleeve — stocks + LEAPS moonshot (paper, daily cadence)"

[[bin]]
name = "aschenbrenner-unlimited"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
once_cell = "1"
regex = "1"
